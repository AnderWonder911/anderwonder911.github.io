<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The portal's icon: the 9 of the PROJECT 9 mark in bone ink on the raised deck, the frontier bar's own two
       colours (the tokens ink and deck-raised in globals.css), drawn as strokes so it needs no font. It carries no
       figure and no name. An XML comment may not hold two hyphens in a row, or the browser draws nothing. -->
  <rect width="32" height="32" rx="4" fill="#0a2127"/>
  <g fill="none" stroke="#eee9dc" stroke-width="4">
    <ellipse cx="16" cy="12.5" rx="7" ry="6"/>
    <path d="M23 12.5V18c0 5.5-3.5 8.5-9 8.5H9.5"/>
  </g>
</svg>
